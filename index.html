<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourseCraft English</title>
<meta name="description" content="ESL resources by CourseCraft English, including the Talking Picture Dictionary with audio for every word.">
<style>
  :root { --bg:#fffaf3; --ink:#1f2a37; --muted:#5b6675; --accent:#e4572e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 20px; }
  h1 { font-size:2rem; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 28px; }
  a.card { display:block; padding:20px 22px; border-radius:14px; background:#fff;
           border:2px solid #f0e3d3; color:var(--ink); text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; font-size:1.15rem; margin-bottom:4px; }
  a.card span { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>CourseCraft English</h1>
  <p>English learning resources for kids and the families who help them.</p>
  <a class="card" href="/talk/">
    <strong>Talking Picture Dictionary &rarr;</strong>
    <span>Tap any word to hear it spoken, normal and slow.</span>
  </a>
</main>
</body>
</html>
